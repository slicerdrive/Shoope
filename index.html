<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Player</title>

<style>
body{
    margin:0;
    background:#000;
}

video{
    width:100%;
    height:100vh;
    object-fit:contain;
    background:#000;
}

#title{
    position:absolute;
    top:10px;
    left:10px;
    color:#fff;
    font-size:14px;
}
</style>

</head>

<body>

<video
id="player"
controls
playsinline
controlsList="nodownload"
>
<source src="" type="video/mp4">
</video>

<script>

/* =========================
   KONFIGURASI
========================= */

const JSON_URL = "videos.json";

/* SHOPEE */

const SHOPEE_LINK =
"https://s.shopee.co.id/7AeWeeLqUU";

const video = document.getElementById("player");

let clicked = false;
let redirected = false;


/* =========================
   REDIRECT SHOPEE
========================= */

function redirectRandom(){

    if(redirected) return;

    redirected = true;

    window.location.href = SHOPEE_LINK;

}


/* =========================
   LOAD VIDEO PERTAMA
========================= */

fetch(JSON_URL)

.then(res => {

    if(!res.ok){
        throw new Error("Gagal mengambil videos.json");
    }

    return res.json();

})

.then(data => {

    const selected = data.videos[0];

    if(!selected){

        throw new Error("Video tidak ditemukan");

    }

    video.src = selected.cdn;

})

.catch(error => {

    console.error(error);

    document.body.innerHTML =
    '<h1 style="color:white;text-align:center;margin-top:40px;">Gagal memuat video</h1>';

});


/* =========================
   KLIK VIDEO
========================= */

video.addEventListener("click", function(){

    if(!clicked){

        clicked = true;

        return;
    }

    redirectRandom();

});


/* =========================
   REDIRECT SETELAH 30 DETIK
========================= */

video.addEventListener("timeupdate", function(){

    if(
        !redirected &&
        video.currentTime >= 30
    ){

        redirectRandom();

    }

});

</script>

</body>
</html>
