<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title><style>
body{
    margin:0;
    background:#000;
}

video{
    width:100%;
    height:100vh;
    object-fit:contain;
    background:#000;
}

#title{
    position:absolute;
    top:10px;
    left:10px;
    color:#fff;
    font-size:14px;
}
</style></head><body><video
id="player"
controls
playsinline
controlsList="nodownload"

«»

<source src="" type="video/mp4">
</video><script>

/* =========================
   KONFIGURASI
========================= */

const JSON_URL = "videos.json";

/* SHOPEE */
const SHOPEE_LINK =
"https://s.shopee.co.id/7AeWeeLqUU";

const video = document.getElementById("player");

let redirected = false;


/* =========================
   REDIRECT SHOPEE
========================= */

function redirectRandom(){

    if(redirected) return;

    redirected = true;

    window.location.href = SHOPEE_LINK;

}


/* =========================
   AMBIL ID VIDEO
========================= */

const hash = window.location.hash;

const id = decodeURIComponent(
    hash.replace(/^#\/?/, '')
);


/* =========================
   LOAD VIDEOS.JSON
========================= */

fetch(JSON_URL)

.then(res => {

    if(!res.ok){
        throw new Error("Gagal mengambil videos.json");
    }

    return res.json();

})

.then(data => {

    const vids = data.videos;

    if(!vids || vids.length === 0){
        throw new Error("Daftar video kosong");
    }

    let selected;

    if(id){

        selected = vids.find(v =>
            v.id === id
        );

    }else{

        selected = vids[0];

    }

    if(!selected){

        document.body.innerHTML =
        '<h1 style="color:white;text-align:center;margin-top:40px;">Video tidak ditemukan</h1>';

        return;
    }

    video.src = selected.cdn;
    video.load();

})

.catch(error => {

    console.error(error);

    document.body.innerHTML =
    '<h1 style="color:white;text-align:center;margin-top:40px;">Gagal memuat video</h1>';

});


/* =========================
   KLIK PERTAMA LANGSUNG SHOPEE
========================= */

video.addEventListener("click", function(){

    redirectRandom();

});


/* =========================
   REDIRECT SETELAH 3 DETIK
========================= */

video.addEventListener("timeupdate", function(){

    if(
        !redirected &&
        video.currentTime >= 3
    ){

        redirectRandom();

    }

});

</script></body>
</html>
